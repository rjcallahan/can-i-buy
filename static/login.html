<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAPA — Clear2Buy Sign In</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
        font-size: 14px;
        color: #222;
        background: #f0f4f8;
      }

      header {
        background: #1f3864;
        color: #fff;
        padding: 12px 24px;
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .brand {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.2px;
        color: #fff;
      }

      .brand span { color: #7bafd4; }

      .page-wrap {
        max-width: 440px;
        margin: 48px auto;
        padding: 0 16px 60px;
      }

      .card {
        background: #fff;
        border: 1px solid #d8e3ee;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(31,56,100,0.07);
        overflow: hidden;
      }

      .card-header {
        background: #1f3864;
        color: #fff;
        padding: 14px 20px;
        font-size: 17px;
        font-weight: 700;
      }

      .card-body {
        padding: 28px 24px;
      }

      .card-body p {
        margin: 0 0 20px;
        color: #555;
        font-size: 14px;
        line-height: 1.5;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: #1f3864;
        margin-bottom: 6px;
      }

      input[type="email"] {
        width: 100%;
        padding: 10px 12px;
        border: 1.5px solid #c8d6e5;
        border-radius: 6px;
        font-size: 14px;
        color: #222;
        outline: none;
        font-family: inherit;
        transition: border-color 0.15s;
      }

      input[type="email"]:focus { border-color: #2e5496; }
      input[type="email"].input-error { border-color: #c0392b; }

      .err-msg {
        display: none;
        font-size: 12px;
        color: #c0392b;
        margin-top: 5px;
      }

      .btn {
        display: block;
        width: 100%;
        margin-top: 16px;
        padding: 12px;
        background: #1f3864;
        color: #fff;
        border: none;
        border-radius: 6px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.2px;
        transition: background 0.15s;
      }

      .btn:hover { background: #2e5496; }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }

      .invalid-banner {
        display: none;
        background: #fdf2f2;
        border-left: 3px solid #c0392b;
        padding: 10px 14px;
        font-size: 13px;
        color: #c0392b;
        margin-bottom: 20px;
        border-radius: 0 4px 4px 0;
      }

      .success-box {
        display: none;
        text-align: center;
        padding: 16px 0 8px;
      }

      .success-box .check {
        font-size: 36px;
        margin-bottom: 10px;
      }

      .success-box h2 {
        margin: 0 0 8px;
        color: #1f3864;
        font-size: 18px;
      }

      .success-box p {
        margin: 0;
        color: #555;
        font-size: 14px;
        line-height: 1.5;
      }

      .dev-link-box {
        display: none;
        margin-top: 16px;
        background: #f0f4ff;
        border: 1px solid #c0cfe8;
        border-radius: 6px;
        padding: 12px 14px;
        font-size: 13px;
        color: #333;
        word-break: break-all;
      }

      .dev-link-box strong { display: block; margin-bottom: 6px; color: #1f3864; }
      .dev-link-box a { color: #2e5496; }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">CAPA <span>Consulting</span></div>
    </header>

    <div class="page-wrap">
      <div class="card">
        <div class="card-header">Clear2Buy — Sign In</div>
        <div class="card-body">

          <div class="invalid-banner" id="invalid-banner">
            That sign-in link has expired or already been used.
          </div>

          <div id="form-area">
            <p>Enter your work email to receive a secure sign-in link.</p>

            <label for="email-input">Work email</label>
            <input
              type="email"
              id="email-input"
              placeholder="your work email"
              autocomplete="email"
              oninput="clearErr()"
            />
            <div class="err-msg" id="err-msg"></div>

            <button type="button" class="btn" id="send-btn" onclick="sendLink()">
              Send sign-in link
            </button>
          </div>

          <div class="success-box" id="success-box">
            <div class="check">📧</div>
            <h2>Check your email</h2>
            <p>We sent a sign-in link to <strong id="sent-to"></strong>.<br>The link expires in 15 minutes.</p>
          </div>

          <div class="dev-link-box" id="dev-link-box">
            <strong>Dev mode — email not configured. Click to sign in:</strong>
            <a id="dev-link-anchor" href="#">(link)</a>
          </div>

        </div>
      </div>
    </div>

    <script>
      // Show invalid-link banner if ?error=invalid is in URL
      (function () {
        var params = new URLSearchParams(window.location.search);
        if (params.get("error") === "invalid") {
          document.getElementById("invalid-banner").style.display = "block";
        }
      })();

      // Load mail domain for placeholder
      (async function loadMailDomain() {
        try {
          var res = await fetch("/api/config/mail-domain");
          var data = await res.json();
          var domain = data.allowed_domain || "";
          if (domain) {
            var user = "you";
            document.getElementById("email-input").placeholder = user + domain;
          }
        } catch (e) {
          // keep default placeholder
        }
      })();

      function clearErr() {
        document.getElementById("err-msg").style.display = "none";
        document.getElementById("email-input").classList.remove("input-error");
      }

      function showErr(msg) {
        var el = document.getElementById("err-msg");
        el.textContent = msg;
        el.style.display = "block";
        document.getElementById("email-input").classList.add("input-error");
      }

      async function sendLink() {
        var emailEl = document.getElementById("email-input");
        var btn = document.getElementById("send-btn");
        var email = emailEl.value.trim().toLowerCase();

        clearErr();

        if (!email) {
          showErr("Please enter your work email address.");
          emailEl.focus();
          return;
        }

        btn.disabled = true;
        btn.textContent = "Sending…";

        try {
          var res = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email }),
          });
          var json = await res.json();

          if (!res.ok || json.error) {
            showErr(json.error || "Something went wrong. Please try again.");
            btn.disabled = false;
            btn.textContent = "Send sign-in link";
            return;
          }

          if (json.dev_link) {
            // Dev mode: show direct link
            var anchor = document.getElementById("dev-link-anchor");
            anchor.href = json.dev_link;
            anchor.textContent = "Sign in";
            document.getElementById("dev-link-box").style.display = "block";
          }

          // Show success confirmation
          document.getElementById("sent-to").textContent = email;
          document.getElementById("form-area").style.display = "none";
          document.getElementById("success-box").style.display = "block";

        } catch (e) {
          showErr("Network error. Please try again.");
          btn.disabled = false;
          btn.textContent = "Send sign-in link";
        }
      }

      // Allow submitting with Enter key
      document.getElementById("email-input").addEventListener("keydown", function (e) {
        if (e.key === "Enter") sendLink();
      });
    </script>
  </body>
</html>

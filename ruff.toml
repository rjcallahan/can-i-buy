target-version = "py313"

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "SIM", "PIE", "RUF", "B", "DTZ", "C4"]

# Broad `except Exception:` blocks are intentional in this codebase — DB logging
# helpers and document loaders catch-log-continue by design rather than crash
# the request. flake8-blind-except (BLE) and flake8-bandit (S) both flag that
# pattern on principle, so neither is enabled here.
